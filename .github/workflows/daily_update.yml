name: Daily 5.2 ETF Temperature Strategy Update

on:
  # 1. 每个交易日（周一至周五）北京时间 18:30 (UTC 10:30) 自动运行
  schedule:
    - cron: '30 10 * * 1-5'

  # 2. 支持在 GitHub Actions 页面手动点击 "Run workflow" 立即触发
  workflow_dispatch:

  # 3. 当往 main 分支推送代码或前端模板更新时，自动运行并发布到 gh-pages 分支
  push:
    branches:
      - main
      - master

# 显式声明仓库写入权限，允许 Action 将生成结果推送到专门的 gh-pages 分支
permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 从 main 分支检出作业代码 (Checkout)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖 (akshare & pandas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行 5.2 估值温度策略计算 (生成 docs/ 下的数据文件)
        run: |
          python run_daily_5_2.py

      - name: 5. 将今日报告写入 GitHub Actions Summary
        if: success()
        run: |
          if [ -f docs/latest_report.md ]; then
            cat docs/latest_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 6. 仅将结果提交到专门的 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore(data): update 5.2 ETF temperature data'
